# Points the Homebrew tap's cask at each new public release. The release's own
# smpl-menubar.rb (generated by scripts/release.sh) is used only after its version and
# checksum match the ZIP users download. Pushes with TAP_DEPLOY_KEY, a deploy key with
# write access to TechSupportz/homebrew-tap only. Re-run for a tag with "Run workflow".
name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.1
        required: true

permissions:
  contents: read

concurrency: homebrew-tap

jobs:
  tap:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the cask against the published ZIP
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected tag $TAG"; exit 1; }
          ZIP="smpl-menubar-$VERSION-universal.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "$ZIP" --pattern smpl-menubar.rb
          SHA=$(sha256sum "release/$ZIP" | cut -d' ' -f1)
          grep -qx "  version \"$VERSION\"" release/smpl-menubar.rb \
            || { echo "::error::Cask is not for $VERSION"; exit 1; }
          grep -qx "  sha256 \"$SHA\"" release/smpl-menubar.rb \
            || { echo "::error::Cask checksum does not match $ZIP"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: TechSupportz/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Commit and push the cask
        working-directory: tap
        run: |
          set -euo pipefail
          CASK=Casks/smpl-menubar.rb
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$CASK")
          if [[ -n "$CURRENT" && "$CURRENT" != "$VERSION" ]] &&
             [[ $(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1) == "$CURRENT" ]]; then
            echo "::error::Tap already has newer $CURRENT"; exit 1
          fi
          cp ../release/smpl-menubar.rb "$CASK"
          if git diff --quiet; then echo "Tap already on $VERSION"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "🍺 Update smpl.menubar to $VERSION"
          git push -q
          echo "::notice::Tap updated to $VERSION"
